<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Graphite paper and ink-blue swatch</title>
  <desc id="desc">Cool gray field with a soft glow and an ink-blue accent bar for CSS image regression.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5dbe6"/>
      <stop offset="45%" stop-color="#e9ecf1"/>
      <stop offset="100%" stop-color="#e6e9f0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="240" fill="url(#paper)"/>
  <circle cx="560" cy="-20" r="160" fill="#c8d0dc" opacity="0.55"/>
  <rect x="48" y="72" width="220" height="12" rx="2" fill="#1a1d22"/>
  <rect x="48" y="100" width="160" height="8" rx="2" fill="#4a515c"/>
  <rect x="48" y="148" width="96" height="28" rx="3" fill="#1c4d89"/>
  <text x="160" y="168" font-family="system-ui, sans-serif" font-size="14" fill="#e9ecf1">ink</text>
</svg>
